name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  observed-import:
    name: postgres-observed-import
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c
      - name: Import observed snapshots and analyze on disposable PostgreSQL 16 and HypoPG
        run: bash demo/check-import.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: observed-import-test-results
          path: |
            build/test-results/test/
            build/reports/tests/test/
            build/report-import-verification/
          if-no-files-found: warn
  metrics-integration:
    name: postgres-hypopg-metrics
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c
      - name: Verify metrics against real costs in a disposable database
        run: bash demo/check-metrics.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: real-cost-verification
          path: |
            build/metrics-verification/
            build/reports/tests/test/
          if-no-files-found: warn

  build:
    name: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Build and test
        run: ./gradlew --no-daemon build installDist reportPreview
      - name: Verify report JavaScript and offline Chromium chart geometry
        run: bash demo/check-report-ui.sh
      - name: Smoke-test packaged CLI without a database
        run: |
          build/install/indexbudget/bin/indexbudget --help
          build/install/indexbudget/bin/indexbudget --version

  catalog-integration:
    name: postgres-catalog-integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16.15-bookworm
        env:
          POSTGRES_DB: catalog_test
          # Disposable runner only; loopback port, no shared stand credentials.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:55434:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d catalog_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Read a real PostgreSQL catalog as an unprivileged role
        env:
          INDEXBUDGET_CATALOG_TEST_URL: jdbc:postgresql://127.0.0.1:55434/catalog_test
          INDEXBUDGET_CATALOG_TEST_USER: postgres
        run: ./gradlew --no-daemon test --tests '*JdbcCatalogReaderIntegrationTest' --tests '*SqlResolutionIntegrationTest'

  hypopg-integration:
    name: postgres-hypopg-integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Evaluate exact sets on a disposable PostgreSQL and HypoPG backend
        run: bash demo/check-hypopg.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: brin-verification
          path: build/brin-verification/
          if-no-files-found: warn

  statistics-integration:
    name: postgres-statistics-integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c
      - name: Collect pg_stat_statements on a disposable PostgreSQL 16
        run: bash demo/check-statistics.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: statistics-test-results
          path: |
            build/test-results/test/
            build/reports/tests/test/
          if-no-files-found: warn

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Build and test
        run: ./gradlew --no-daemon build installDist
      - name: Smoke-test packaged CLI without a database
        run: |
          build/install/indexbudget/bin/indexbudget --help
          build/install/indexbudget/bin/indexbudget --version

  catalog-integration:
    name: postgres-catalog-integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16.15-bookworm
        env:
          POSTGRES_DB: catalog_test
          # Disposable runner only; loopback port, no shared stand credentials.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:55434:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d catalog_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Read a real PostgreSQL catalog as an unprivileged role
        env:
          INDEXBUDGET_CATALOG_TEST_URL: jdbc:postgresql://127.0.0.1:55434/catalog_test
          INDEXBUDGET_CATALOG_TEST_USER: postgres
        run: ./gradlew --no-daemon test --tests '*JdbcCatalogReaderIntegrationTest'

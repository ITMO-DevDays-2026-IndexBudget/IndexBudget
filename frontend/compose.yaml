name: indexbudget-frontend
services:
  postgres:
    image: ${FRONTEND_DB_IMAGE:-indexbudget-frontend-db:local}
    build: ../demo/postgres
    restart: unless-stopped
    cpus: 2
    mem_limit: 2g
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:${FRONTEND_DB_PORT:-55433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
    # Одноразовая локальная БД. Не использует volume общей demo-БД.
    tmpfs:
      - /var/lib/postgresql/data
